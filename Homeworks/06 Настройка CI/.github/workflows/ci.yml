name: CI

on:
  # Запускаем workflow при изменениях в папке в ветке main.
  push:
    branches:
      - main
    paths:
      - 'Homeworks/06 Настройка CI/**'

  # Разрешаем ручной запуск из GitHub Actions.
  workflow_dispatch:

# Даем workflow право читать код и публиковать Docker-образ в контейнере.
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/promocode-factory
  DOCKER_CONTEXT: 'Homeworks/06 Настройка CI/src'
  DOCKERFILE: 'Homeworks/06 Настройка CI/src/Dockerfile'

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # Забираем код репозитория.
      - name: Checkout
        uses: actions/checkout@v4

      # Приводим имя образа к нижнему регистру, как требует Docker registry.
      - name: Normalize image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      # Авторизуемся в GitHub Container Registry.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Включаем Docker Buildx для сборки через docker/build-push-action.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Собираем test stage из Dockerfile, внутри него запускаются unit-тесты.
      - name: Run tests
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKER_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          target: test
          push: false

      # Собираем финальный образ и публикуем его в контейнере.
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKER_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
