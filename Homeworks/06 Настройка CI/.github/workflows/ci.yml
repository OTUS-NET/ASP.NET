name: CI

on: 
  push:
    branches: [ main ]
    paths:
      - 'Homeworks/06 Настройка CI/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  CICD:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run unit tests (Dockerfile stage: test)
        run: |
          docker build \
            --target test \
            -t promocodefactory-tests:latest \
            -f "Homeworks/06 Настройка CI/Dockerfile" \
            "Homeworks/06 Настройка CI"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: "Homeworks/06 Настройка CI"
          file: "Homeworks/06 Настройка CI/Dockerfile"
          target: final
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print published image
        run: echo "Published image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"