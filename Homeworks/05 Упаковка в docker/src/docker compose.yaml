services:
    promocode-factory-api:
        build:
            context: .
            dockerfile: Dockerfile

        ports:
            - "8091:8080"

        environment:
            ASPNETCORE_ENVIROMENT: Development
            ConnectionStrings__PromocodeFactoryDb: Data Source=/app/db/PromoCodeFactoryDb.sqlite

        volumes:
            -  db:/app/db

volumes:
    db:
